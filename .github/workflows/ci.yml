name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: backend
    env:
      SEED_DEMO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test in-memory SQLite
        run: python -m pytest -q
        env:
          DATABASE_URL: "sqlite:///:memory:"
      - name: Test persistent SQLite
        run: python -m pytest -q
        env:
          DATABASE_URL: "sqlite:///./ci-tests.db"

  frontend:
    name: Frontend tests, audit and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit
      - name: Build bundled frontend
        run: npm run build
      - name: Test frontend behavior and bundle budgets
        run: npm test
      - name: Verify committed bundle matches source
        run: git diff --exit-code -- ../backend/app/static
